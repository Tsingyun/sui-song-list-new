<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>岁己SUI · 歌单档案</title>
<meta name="description" content="虚拟主播岁己SUI的完整歌单档案：演唱记录、录播片段、数据洞察与点歌统计。">
<link rel="icon" type="image/png" href="__LOGO_DATA_URI__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet">
<script>
/* 主题引导：必须在 <style> 生效前写好 data-theme，否则深色用户会先闪一下白底（FOUC）。
   优先级：localStorage 记忆 > 浅色。首次打开固定浅色（不跟随系统偏好），切换与记忆逻辑在 components.js。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('sui-theme'); } catch (e) {}
  if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
})();
</script>
<!--INLINE_CSS-->
</head>
<body>
<a class="skip-link" href="#view">跳到主要内容</a>

<header class="site-head">
  <div class="site-head-inner">
    <!-- 左上角品牌位 → 岁己SUI 的 B站个人空间（地址由 builder.py 的 BILI_SPACE_URL 注入） -->
    <a class="brand" href="__BILI_SPACE_URL__" target="_blank" rel="noopener noreferrer"
       title="前往岁己SUI 的 B站个人空间（新标签页打开）"
       aria-label="岁己SUI 歌单档案 — 前往 B站个人空间">
      <img class="brand-mark" src="__LOGO_DATA_URI__" alt="岁己SUI" width="34" height="34">
      <span class="brand-text">岁己SUI<em>歌单档案</em></span>
    </a>
    <nav class="site-nav" id="siteNav" aria-label="站内导航">
      <a href="#/" data-nav="home">首页</a>
      <a href="#/songs" data-nav="songs">歌曲</a>
      <a href="#/frequent" data-nav="frequent">常唱金曲</a>
      <a href="#/languages" data-nav="languages">语言</a>
      <a href="#/artists" data-nav="artists">原唱</a>
      <a href="#/insights" data-nav="insights">洞察</a>
      <a href="#/requests" data-nav="requests">点歌</a>
      <a href="#/about" data-nav="about">关于</a>
    </nav>
    <button type="button" class="theme-toggle" id="themeToggle" aria-pressed="false" aria-label="切换深色模式" title="切换浅色 / 深色模式">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.4 14.2A8.4 8.4 0 0 1 9.8 3.6a8.4 8.4 0 1 0 10.6 10.6z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6"/></svg>
    </button>
    <div class="head-actions">
      <button type="button" class="btn btn-ghost btn-sm" id="globalRandom">盲盒抽歌</button>
      <button type="button" class="btn btn-primary btn-sm" id="globalContribute">我要补充</button>
    </div>
  </div>
</header>

<main id="view" class="view" tabindex="-1" aria-live="polite"></main>

<footer class="site-foot" id="siteFoot"></footer>

<!-- floating player -->
<div class="player" id="playerPanel" hidden>
  <div class="player-bar" id="playerDrag">
    <div class="player-titles">
      <span class="player-song" id="playerSongName"></span>
      <span class="player-meta" id="playerSongMeta"></span>
    </div>
    <div class="player-tools">
      <select class="player-select" id="playerClipSelect" aria-label="切换录播版本"></select>
      <a class="player-link" id="playerBiliLink" target="_blank" rel="noopener">B站</a>
      <button type="button" class="player-btn" id="playerMaximize" aria-label="放大播放器" title="放大">⤢</button>
      <button type="button" class="player-btn" id="playerClose" aria-label="关闭播放器" title="关闭">✕</button>
    </div>
  </div>
  <div class="player-body">
    <iframe id="playerIframe" allowfullscreen scrolling="no" frameborder="0"
      allow="autoplay; encrypted-media; fullscreen" referrerpolicy="no-referrer"></iframe>
  </div>
</div>

<!-- modal root / toast / tooltip -->
<div class="modal-root" id="modalRoot"></div>
<div class="toast-root" id="toastRoot" aria-live="assertive"></div>
<div class="tip" id="globalTip" hidden></div>

<button type="button" class="back-top" id="backTop" aria-label="返回顶部" title="返回顶部">↑<img
  class="back-top-perch" src="assets/sui-bird.png" alt="" aria-hidden="true"></button>

<!--INLINE_DATA-->
<!--INLINE_JS-->
</body>
</html>
