<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   岁己SUI 歌单档案 · 设计 tokens
   方向：场刊 / 档案簿编辑风 —— 暖纸底、墨色文字、衬线标题、
   等宽数据字、朱红单强调色、细线分隔。无霓虹、无玻璃拟态、无卡片堆砌。
   ══════════════════════════════════════════════════════════════ */
:root {
  /* 纸与墨 */
  --paper: #f6f2ea;
  --paper-deep: #ede7da;
  --surface: #fdfbf7;
  --ink: #211c15;
  --ink-2: #5c5344;
  --ink-3: #8f8571;
  --line: #ded4c0;
  --line-strong: #b6a88d;

  /* 强调 */
  --accent: #b5371d;          /* 朱红 —— 仅用于激活态/关键数字/标记 */
  --accent-deep: #8e2a15;
  --accent-soft: rgba(181, 55, 29, .07);
  --green: #33604e;           /* 次级状态（偶尔/成功） */

  /* 字体 */
  --serif: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
  --sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Consolas, 'Courier New', monospace;

  /* 字号阶梯（1.25 倍率） */
  --fs-xs: .6875rem;   /* 11 页码/角标 */
  --fs-sm: .75rem;     /* 12 辅助 */
  --fs-md: .875rem;    /* 14 正文辅助 */
  --fs-base: 1rem;     /* 16 正文 */
  --fs-lg: 1.1875rem;  /* 19 小标题 */
  --fs-xl: 1.5rem;     /* 24 区块标题 */
  --fs-2xl: 2.125rem;  /* 34 页面标题 */
  --fs-hero: clamp(2.6rem, 6vw, 4.25rem);

  /* 节奏 */
  --space-1: .25rem;
  --space-2: .5rem;
  --space-3: .75rem;
  --space-4: 1rem;
  --space-5: 1.5rem;
  --space-6: 2rem;
  --space-7: 3rem;
  --space-8: 4.5rem;

  --w-page: 1120px;
  --shadow-pop: 0 2px 6px rgba(33, 28, 21, .08), 0 18px 48px rgba(33, 28, 21, .16);
  --shadow-flat: 0 1px 3px rgba(33, 28, 21, .07);

  --dur: 160ms;
  --dur-slow: 320ms;
  --ease: cubic-bezier(.3, .7, .3, 1);
}

/* ═══════ 基础 ═══════ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--fs-base);
  line-height: 1.7;
  min-height: 100vh;
  /* 纸张肌理：极淡的横纹，代替旧站的扫描线 */
  background-image: repeating-linear-gradient(0deg, transparent 0 3px, rgba(33, 28, 21, .012) 3px 4px);
}

::selection { background: rgba(181, 55, 29, .18); }

h1, h2, h3, h4 { font-family: var(--serif); font-weight: 700; line-height: 1.3; }

a { color: inherit; text-decoration: none; }
a:hover { color: var(--accent-deep); }

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

mark {
  background: rgba(181, 55, 29, .16);
  color: var(--accent-deep);
  padding: 0 .05em;
}

img, svg, iframe { display: block; max-width: 100%; }

/* hidden 属性优先于任何 display 声明 */
[hidden] { display: none !important; }

/* 数字一律等宽 */
.num, .mono {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.01em;
}

.skip-link {
  position: absolute; left: -9999px; top: 0; z-index: 999;
  background: var(--ink); color: var(--paper); padding: .5rem 1rem;
}
.skip-link:focus { left: 0; }

/* 细双线 —— 场刊版式签名 */
.rule-double {
  border: 0;
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--ink);
  height: 3px;
}
.rule { border: 0; border-top: 1px solid var(--line); }

/* 区块头 */
.sec-head { margin-bottom: var(--space-5); }
.sec-kicker {
  font-family: var(--mono);
  font-size: var(--fs-xs);
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: .6em;
}
.sec-kicker::before { content: ''; width: 2.2em; height: 1px; background: var(--accent); }
.sec-title { font-size: var(--fs-xl); margin-top: .35rem; display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; }
.sec-title .sec-sub { font-family: var(--mono); font-size: var(--fs-sm); color: var(--ink-3); font-weight: 400; }
.sec-title .sec-link { margin-left: auto; font-family: var(--sans); font-size: var(--fs-md); color: var(--ink-2); }
.sec-title .sec-link:hover { color: var(--accent-deep); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  html { scroll-behavior: auto; }
}

/* ═══════ 页面框架 ═══════ */

/* 顶栏 */
.site-head {
  position: sticky; top: 0; z-index: 500;
  background: rgba(246, 242, 234, .92);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.site-head-inner {
  max-width: var(--w-page);
  margin: 0 auto;
  padding: .65rem 1.25rem;
  display: flex;
  align-items: center;
  gap: var(--space-5);
}
.brand { display: flex; align-items: center; gap: .6rem; flex-shrink: 0; }
.brand-mark {
  width: 34px; height: 34px;
  object-fit: contain;
  border-radius: 8px;
  /* 小鸟是白底黑描边透明图，落在暖纸底上收一点投影避免"飘" */
  filter: drop-shadow(0 1px 1.5px rgba(33, 28, 21, .22));
}
.brand-text {
  font-family: var(--serif);
  font-weight: 700;
  font-size: 1.05rem;
  letter-spacing: .02em;
  display: flex; flex-direction: column; line-height: 1.25;
}
.brand-text em {
  font-style: normal;
  font-family: var(--mono);
  font-size: var(--fs-xs);
  color: var(--ink-3);
  letter-spacing: .3em;
}

.site-nav {
  display: flex;
  gap: .25rem;
  overflow-x: auto;
  scrollbar-width: none;
  flex: 1;
  min-width: 0;
}
.site-nav::-webkit-scrollbar { display: none; }
.site-nav a {
  padding: .45rem .7rem;
  font-size: var(--fs-md);
  color: var(--ink-2);
  white-space: nowrap;
  border-radius: 4px;
  position: relative;
}
.site-nav a:hover { color: var(--ink); background: rgba(33, 28, 21, .05); }
.site-nav a.active {
  color: var(--accent-deep);
  font-weight: 500;
}
.site-nav a.active::after {
  content: '';
  position: absolute; left: .7rem; right: .7rem; bottom: .1rem;
  height: 2px; background: var(--accent);
}

.head-actions { display: flex; gap: .5rem; flex-shrink: 0; }

/* 主内容 */
.view {
  max-width: var(--w-page);
  margin: 0 auto;
  padding: var(--space-6) 1.25rem var(--space-8);
  min-height: 60vh;
  outline: none;
}

/* 页脚 */
.site-foot {
  border-top: 1px solid var(--ink);
  background: var(--paper-deep);
  margin-top: var(--space-8);
}
.site-foot-inner {
  max-width: var(--w-page);
  margin: 0 auto;
  padding: var(--space-6) 1.25rem var(--space-7);
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr;
  gap: var(--space-6);
}
.foot-col h4 {
  font-family: var(--mono);
  font-size: var(--fs-xs);
  letter-spacing: .2em;
  color: var(--ink-3);
  margin-bottom: .8rem;
  font-weight: 500;
}
.foot-col p, .foot-col li { font-size: var(--fs-sm); color: var(--ink-2); line-height: 2; }
.foot-col ul { list-style: none; }
.foot-col a:hover { color: var(--accent-deep); }
.foot-span {
  font-family: var(--mono);
  font-size: var(--fs-sm);
  color: var(--ink);
  letter-spacing: .08em;
}
.foot-ver {
  display: inline-block;
  margin-top: .5rem;
  font-family: var(--mono);
  font-size: var(--fs-xs);
  color: var(--ink-3);
  border: 1px solid var(--line-strong);
  padding: .1rem .6rem;
  border-radius: 999px;
}
.foot-base { border-top: 1px solid var(--line); }
.foot-base-inner {
  max-width: var(--w-page);
  margin: 0 auto;
  padding: .9rem 1.25rem;
  font-family: var(--mono);
  font-size: var(--fs-xs);
  color: var(--ink-3);
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}

/* 返回顶部 */
.back-top {
  position: fixed;
  right: 1.5rem; bottom: 1.5rem;
  width: 42px; height: 42px;
  display: grid; place-items: center;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  font-size: 1.1rem;
  color: var(--ink-2);
  box-shadow: var(--shadow-flat);
  opacity: 0;
  transform: translateY(10px);
  pointer-events: none;
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease), background var(--dur);
  z-index: 400;
}
.back-top.visible { opacity: 1; transform: none; pointer-events: auto; }
.back-top:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ═══════ 组件 ═══════ */

/* 按钮 */
.btn {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  padding: .5rem 1.05rem;
  border: 1px solid var(--ink);
  border-radius: 4px;
  font-size: var(--fs-md);
  line-height: 1.4;
  background: var(--surface);
  transition: background var(--dur), color var(--dur), border-color var(--dur), transform var(--dur);
  white-space: nowrap;
}
.btn:hover { background: var(--ink); color: var(--paper); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fdf9f0; }
.btn-primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); color: #fdf9f0; }
.btn-ghost { background: transparent; border-color: var(--line-strong); color: var(--ink-2); }
.btn-ghost:hover { background: rgba(33, 28, 21, .05); color: var(--ink); }
.btn-sm { padding: .3rem .75rem; font-size: var(--fs-sm); }

/* 筛选 chips */
.chipbar {
  display: flex;
  flex-wrap: wrap;
  gap: .4rem;
  align-items: center;
}
.chip {
  padding: .22rem .7rem;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  font-size: var(--fs-sm);
  color: var(--ink-2);
  background: transparent;
  transition: all var(--dur);
  white-space: nowrap;
}
.chip .num { font-size: var(--fs-xs); color: var(--ink-3); margin-left: .25em; }
.chip:hover { border-color: var(--ink); color: var(--ink); }
.chip.active {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}
.chip.active .num { color: rgba(246, 242, 234, .6); }

/* 搜索框 */
.search {
  position: relative;
  flex: 1;
  min-width: 200px;
}
.search input {
  width: 100%;
  padding: .5rem .9rem .5rem 2.1rem;
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  background: var(--surface);
  font-size: 16px; /* 防 iOS 聚焦缩放 */
  transition: border-color var(--dur), box-shadow var(--dur);
}
.search input:focus {
  outline: none;
  border-color: var(--ink);
  box-shadow: 0 0 0 3px rgba(33, 28, 21, .08);
}
.search::before {
  content: '';
  position: absolute; left: .75rem; top: 50%;
  width: 12px; height: 12px;
  transform: translateY(-50%);
  border: 1.5px solid var(--ink-3);
  border-radius: 50%;
  pointer-events: none;
}
.search::after {
  content: '';
  position: absolute; left: 1.28rem; top: 50%;
  width: 6px; height: 1.5px;
  background: var(--ink-3);
  transform: rotate(45deg) translateY(4px);
  pointer-events: none;
}

.select {
  padding: .45rem .7rem;
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  background: var(--surface);
  font-size: var(--fs-md);
  color: var(--ink);
}

/* 语言徽标 —— 单色描边，小号等宽 */
.lang-tag {
  display: inline-block;
  font-family: var(--mono);
  font-size: var(--fs-xs);
  letter-spacing: .1em;
  color: var(--ink-3);
  border: 1px solid var(--line);
  padding: 0 .45em;
  border-radius: 3px;
  white-space: nowrap;
}
.lang-tag[data-lang="中文"] { color: var(--accent-deep); border-color: rgba(181, 55, 29, .35); }
.lang-tag[data-lang="日语"] { color: var(--green); border-color: rgba(51, 96, 78, .4); }

/* 标签徽标 */
.tag-tag {
  display: inline-block;
  font-size: var(--fs-xs);
  color: var(--ink-3);
  background: rgba(33, 28, 21, .045);
  padding: 0 .45em;
  border-radius: 3px;
  white-space: nowrap;
}

/* 歌曲列表 —— 索引式清单 */
.rowlist { border-top: 1px solid var(--ink); }
.rowrow {
  display: grid;
  grid-template-columns: 3.2rem 1fr minmax(0, 14rem) 5.5rem 4.5rem 6.2rem 2.6rem;
  align-items: center;
  gap: .75rem;
  padding: .55rem .5rem;
  border-bottom: 1px solid var(--line);
  font-size: var(--fs-md);
  transition: background var(--dur);
  position: relative;
}
.rowrow:hover { background: rgba(33, 28, 21, .035); }
.rowrow.is-top10 { background: linear-gradient(90deg, var(--accent-soft), transparent 55%); }
.rowrow.is-top10:hover { background: rgba(181, 55, 29, .09); }
.row-idx {
  font-family: var(--mono);
  font-size: var(--fs-sm);
  color: var(--ink-3);
  text-align: right;
}
.is-top10 .row-idx { color: var(--accent); font-weight: 600; }
.row-name {
  min-width: 0;
  display: flex;
  align-items: baseline;
  gap: .5rem;
  flex-wrap: wrap;
}
.rowrow > .row-name { flex: 0 1 auto; }
.row-name .nm {
  min-width: 0;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 100%;
}
.row-name .tr {
  font-size: var(--fs-xs);
  color: var(--ink-3);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 12em;
}
.row-name .tags { display: inline-flex; gap: .3rem; flex-shrink: 0; }
.row-artist {
  color: var(--ink-2);
  font-size: var(--fs-sm);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.row-count {
  font-family: var(--mono);
  font-weight: 600;
  text-align: right;
}
.row-count[data-tier="frequent"] { color: var(--accent); }
.row-count[data-tier="occasional"] { color: var(--green); }
.row-count[data-tier="rare"] { color: var(--ink-3); font-weight: 400; }
.row-last {
  font-family: var(--mono);
  font-size: var(--fs-sm);
  color: var(--ink-3);
  text-align: right;
  cursor: help;
}
.row-play {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  color: var(--ink-2);
  font-size: .7rem;
  transition: all var(--dur);
  flex-shrink: 0;
  background: var(--surface);
}
.row-play:hover { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.row-play.is-search { border-style: dashed; }
.list-empty {
  padding: 3rem 1rem;
  text-align: center;
  color: var(--ink-3);
  font-family: var(--mono);
  font-size: var(--fs-md);
}

/* 分页 */
.pager {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: .35rem;
  padding: var(--space-5) 0 var(--space-2);
  flex-wrap: wrap;
}
.pager button, .pager .dots {
  min-width: 34px; height: 34px;
  padding: 0 .5rem;
  display: inline-grid; place-items: center;
  border: 1px solid var(--line);
  border-radius: 4px;
  font-family: var(--mono);
  font-size: var(--fs-sm);
  color: var(--ink-2);
  background: var(--surface);
}
.pager button:hover { border-color: var(--ink); color: var(--ink); }
.pager button.active { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.pager button:disabled { opacity: .35; cursor: default; }
.pager .dots { border: 0; background: none; }
.list-meta {
  text-align: center;
  font-family: var(--mono);
  font-size: var(--fs-sm);
  color: var(--ink-3);
  padding-bottom: var(--space-4);
}

/* 数字图块（统计 figure）—— 无卡片，细线分栏 */
.figures {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  border-block: 1px solid var(--ink);
}
.figures .fig {
  padding: var(--space-4) .75rem;
  text-align: center;
  border-right: 1px solid var(--line);
  transition: background var(--dur);
}
.figures .fig:last-child { border-right: 0; }
.figures .fig.clickable { cursor: pointer; }
.figures .fig.clickable:hover { background: var(--accent-soft); }
.fig-num {
  font-family: var(--mono);
  font-size: 1.9rem;
  font-weight: 600;
  letter-spacing: -.02em;
  line-height: 1.15;
}
.fig-label { font-size: var(--fs-sm); color: var(--ink-3); margin-top: .2rem; }

/* 弹层 */
.modal-root .overlay {
  position: fixed; inset: 0; z-index: 900;
  background: rgba(33, 28, 21, .45);
  display: grid;
  place-items: center;
  padding: 1rem;
  animation: fadeIn var(--dur-slow) var(--ease);
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--surface);
  border: 1px solid var(--ink);
  border-radius: 8px;
  box-shadow: var(--shadow-pop);
  width: min(520px, 100%);
  max-height: min(86vh, 720px);
  display: flex;
  flex-direction: column;
  animation: modalIn var(--dur-slow) var(--ease);
}
@keyframes modalIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.modal-head {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: .9rem 1.25rem;
  border-bottom: 1px solid var(--line);
}
.modal-head h3 { font-size: var(--fs-lg); flex: 1; }
.modal-head .modal-kicker {
  font-family: var(--mono);
  font-size: var(--fs-xs);
  letter-spacing: .18em;
  color: var(--accent);
}
.modal-x {
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border-radius: 4px;
  color: var(--ink-3);
  font-size: 1rem;
}
.modal-x:hover { background: rgba(33, 28, 21, .06); color: var(--ink); }
.modal-body { padding: 1.25rem; overflow-y: auto; }

/* Toast */
.toast-root {
  position: fixed;
  top: 1rem; left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: .5rem;
  align-items: center;
  pointer-events: none;
}
.toast {
  background: var(--ink);
  color: var(--paper);
  padding: .45rem 1.2rem;
  border-radius: 999px;
  font-size: var(--fs-md);
  box-shadow: var(--shadow-pop);
  animation: toastIn var(--dur-slow) var(--ease);
}
.toast.out { opacity: 0; transition: opacity var(--dur-slow); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

/* 悬浮提示（日期/热力图/streak 链） */
.tip {
  position: fixed;
  z-index: 950;
  background: var(--surface);
  border: 1px solid var(--ink);
  border-radius: 6px;
  box-shadow: var(--shadow-pop);
  padding: .6rem .8rem;
  font-size: var(--fs-sm);
  max-width: 300px;
  max-height: 45vh;
  overflow-y: auto;
  pointer-events: auto;
}
.tip .tip-title {
  font-family: var(--mono);
  font-size: var(--fs-xs);
  color: var(--ink-3);
  margin-bottom: .35rem;
  letter-spacing: .08em;
}
.tip .tip-date {
  display: inline-block;
  font-family: var(--mono);
  font-size: var(--fs-xs);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 0 .4em;
  margin: .1rem;
}
.tip .tip-date.first { color: var(--accent-deep); border-color: rgba(181, 55, 29, .4); }
.tip .tip-date.last { color: var(--ink); border-color: var(--ink); font-weight: 600; }
.tip .tip-song { cursor: pointer; padding: .05rem 0; }
.tip .tip-song:hover { color: var(--accent-deep); }
.tip .tip-song .num { color: var(--ink-3); margin-left: .4em; }

/* 浮动播放器 */
.player {
  position: fixed;
  left: 1.25rem; bottom: 1.25rem;
  width: min(380px, calc(100vw - 2rem));
  background: var(--surface);
  border: 1px solid var(--ink);
  border-radius: 8px;
  box-shadow: var(--shadow-pop);
  z-index: 800;
  overflow: hidden;
}
.player.maximized { width: min(720px, calc(100vw - 2rem)); }
.player-bar {
  display: flex;
  align-items: center;
  gap: .6rem;
  padding: .5rem .75rem;
  cursor: grab;
  border-bottom: 1px solid var(--line);
  touch-action: none;
}
.player-bar:active { cursor: grabbing; }
.player-titles { min-width: 0; flex: 1; }
.player-song {
  display: block;
  font-weight: 600;
  font-size: var(--fs-md);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.player-meta {
  display: block;
  font-family: var(--mono);
  font-size: var(--fs-xs);
  color: var(--ink-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.player-tools { display: flex; align-items: center; gap: .35rem; flex-shrink: 0; }
.player-select {
  max-width: 110px;
  font-family: var(--mono);
  font-size: var(--fs-xs);
  border: 1px solid var(--line-strong);
  border-radius: 3px;
  padding: .15rem .25rem;
  background: var(--surface);
}
.player-link {
  font-family: var(--mono);
  font-size: var(--fs-xs);
  color: var(--ink-2);
  border: 1px solid var(--line-strong);
  border-radius: 3px;
  padding: .1rem .45rem;
}
.player-link:hover { color: var(--paper); background: var(--ink); border-color: var(--ink); }
.player-btn {
  width: 26px; height: 26px;
  display: grid; place-items: center;
  color: var(--ink-3);
  border-radius: 4px;
  font-size: .85rem;
}
.player-btn:hover { background: rgba(33, 28, 21, .07); color: var(--ink); }
.player-body { aspect-ratio: 16 / 9; background: #000; }
.player-body iframe { width: 100%; height: 100%; border: 0; }

/* 导出面板 */
.export-pop {
  position: absolute;
  right: 0; top: calc(100% + .4rem);
  background: var(--surface);
  border: 1px solid var(--ink);
  border-radius: 6px;
  box-shadow: var(--shadow-pop);
  padding: .4rem;
  display: flex;
  flex-direction: column;
  min-width: 150px;
  z-index: 600;
}
.export-pop button {
  text-align: left;
  padding: .45rem .75rem;
  border-radius: 4px;
  font-size: var(--fs-md);
  display: flex;
  justify-content: space-between;
  gap: 1rem;
}
.export-pop button:hover { background: rgba(33, 28, 21, .06); }
.export-pop button .mono { color: var(--ink-3); font-size: var(--fs-xs); }

/* 等级徽章 */
.lvl {
  display: inline-block;
  font-family: var(--mono);
  font-size: var(--fs-xs);
  line-height: 1;
  padding: .18em .5em;
  border-radius: 3px;
  border: 1px solid currentColor;
  vertical-align: 1px;
}
.lvl[data-l="1"] { color: var(--ink-3); }
.lvl[data-l="2"] { color: var(--ink-2); }
.lvl[data-l="3"] { color: var(--ink); font-weight: 600; }
.lvl[data-l="4"] { color: var(--green); font-weight: 600; }
.lvl[data-l="5"] { color: #fdf9f0; background: var(--accent); border-color: var(--accent); font-weight: 600; }

/* 👑 / 🔥 */
.crown { font-size: .85em; }
.fire {
  font-size: var(--fs-sm);
  cursor: help;
  letter-spacing: -.12em;
}

/* 通用横向条（占比） */
.bar-track {
  height: 5px;
  background: rgba(33, 28, 21, .08);
  border-radius: 999px;
  overflow: hidden;
}
.bar-fill { height: 100%; background: var(--accent); border-radius: 999px; }
.bar-fill.dim { background: var(--line-strong); }

/* 详情面板（点歌观众） */
.sidepanel {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: min(420px, 92vw);
  background: var(--surface);
  border-left: 1px solid var(--ink);
  box-shadow: var(--shadow-pop);
  z-index: 880;
  transform: translateX(100%);
  transition: transform var(--dur-slow) var(--ease);
  display: flex;
  flex-direction: column;
}
.sidepanel.open { transform: none; }
.sidepanel-head {
  padding: 1.1rem 1.25rem;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: flex-start;
  gap: .75rem;
}
.sidepanel-head h3 { font-size: var(--fs-xl); flex: 1; }
.sidepanel-body { padding: 1.25rem; overflow-y: auto; flex: 1; }
.sidepanel-mask {
  position: fixed; inset: 0;
  background: rgba(33, 28, 21, .3);
  z-index: 870;
}

/* 空状态 */
.empty {
  padding: var(--space-7) 1rem;
  text-align: center;
  color: var(--ink-3);
}
.empty .mono { font-size: var(--fs-sm); }

/* ═══════ 视图 ═══════ */

/* ─── 首页 ─── */
.masthead { padding: var(--space-7) 0 var(--space-6); }
.masthead-kicker {
  font-family: var(--mono);
  font-size: var(--fs-xs);
  letter-spacing: .34em;
  text-transform: uppercase;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: .8em;
}
.masthead-kicker::after { content: ''; flex: 1; height: 1px; background: var(--line-strong); }
.masthead h1 {
  font-size: var(--fs-hero);
  font-weight: 900;
  letter-spacing: .02em;
  line-height: 1.15;
  margin: .6rem 0 .4rem;
}
.masthead h1 .thin { font-weight: 600; }
.masthead-sub {
  display: flex;
  align-items: baseline;
  gap: 1rem;
  flex-wrap: wrap;
  color: var(--ink-2);
  font-size: var(--fs-md);
}
.masthead-sub .mono { color: var(--ink-3); font-size: var(--fs-sm); letter-spacing: .06em; }

.home-grid {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: var(--space-7);
  margin-top: var(--space-7);
}

/* 最近演出 */
.recent-day { display: flex; gap: 1rem; padding: .6rem 0; border-bottom: 1px solid var(--line); }
.recent-day:last-child { border-bottom: 0; }
.recent-date {
  font-family: var(--mono);

  padding-top: .15rem;
  min-width: 5.6em;
}
.recent-date .num { font-weight: 600; }
.recent-songs { display: flex; flex-wrap: wrap; gap: .3rem .5rem; min-width: 0; }
.recent-songs a {
  font-size: var(--fs-md);
  color: var(--ink);
  border-bottom: 1px solid transparent;
}
.recent-songs a:hover { color: var(--accent-deep); border-bottom-color: var(--accent); }

/* 点歌速览 */
.req-teaser { display: flex; flex-direction: column; gap: .8rem; }
.req-teaser .king {
  display: flex;
  align-items: baseline;
  gap: .6rem;
  padding: .8rem 1rem;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: var(--surface);
}
.req-teaser .king .crown { font-size: 1.2rem; }
.req-teaser .king b { font-family: var(--serif); font-size: var(--fs-lg); }
.req-teaser .king .num { color: var(--accent); font-weight: 600; }
.streak-line { display: flex; align-items: baseline; gap: .5rem; font-size: var(--fs-md); color: var(--ink-2); flex-wrap: wrap; }
.streak-line b { font-weight: 600; color: var(--ink); }

/* 工具行 */
.home-tools { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: var(--space-6); }

/* 紧凑行（首页右栏等窄容器） */
.rowrow.compact { grid-template-columns: 2rem minmax(0, 1fr) 3rem 5.4rem; }
.rowrow.compact .row-idx { width: auto; }

/* ─── 歌曲浏览 ─── */
.toolbar { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin-bottom: var(--space-3); }
.toolbar .chipbar { flex: 1 1 100%; }
.toolbar-spacer { flex: 1; }
.export-wrap { position: relative; }

/* ─── 歌曲详情 ─── */
.song-hero { padding: var(--space-5) 0 var(--space-4); border-bottom: 1px solid var(--ink); }
.song-hero .crumbs { font-family: var(--mono); font-size: var(--fs-xs); color: var(--ink-3); letter-spacing: .1em; margin-bottom: .8rem; }
.song-hero .crumbs a:hover { color: var(--accent-deep); }
.song-hero h1 {
  font-size: clamp(1.9rem, 4.5vw, 3rem);
  font-weight: 900;
  line-height: 1.25;
}
.song-hero .tr-name { font-size: var(--fs-lg); color: var(--ink-3); font-family: var(--serif); margin-top: .2rem; }
.song-hero .meta-line {
  display: flex;
  align-items: center;
  gap: .6rem;
  flex-wrap: wrap;
  margin-top: .9rem;
  font-size: var(--fs-md);
  color: var(--ink-2);
}
.song-hero .meta-line .artist { font-weight: 600; color: var(--ink); }
.song-hero .actions { display: flex; gap: .5rem; margin-top: 1.1rem; flex-wrap: wrap; }

.song-detail-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: var(--space-7);
  padding-top: var(--space-5);
}
.song-detail-grid > * { min-width: 0; }
.song-figures {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-block: 1px solid var(--line-strong);
  margin-bottom: var(--space-5);
}
.song-figures .fig { padding: .9rem .5rem; border-right: 1px solid var(--line); }
.song-figures .fig:last-child { border-right: 0; }
.song-figures .fig-num { font-size: 1.45rem; }

/* 演出时间轴 */
.timeline { margin: var(--space-4) 0 var(--space-6); }
.timeline-year { display: grid; grid-template-columns: 3.2rem 1fr; gap: 1rem; padding: .7rem 0; border-bottom: 1px solid var(--line); align-items: center; }
.timeline-year:last-child { border-bottom: 0; }
.timeline-year .yr { font-family: var(--mono); font-weight: 600; color: var(--ink-2); }
.timeline-strip { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; align-items: end; }
.timeline-strip .month { text-align: center; }
.timeline-strip .dot {
  width: 100%;
  margin: 0 auto;
  border-radius: 2px;
  background: var(--accent);
  min-height: 3px;
  opacity: .85;
}
.timeline-strip .dot.zero { background: var(--line); min-height: 2px; opacity: .5; }
.timeline-strip .m-label { font-family: var(--mono); font-size: 9px; color: var(--ink-3); margin-top: .3rem; }

.date-list {
  columns: 2;
  column-gap: 2rem;
  font-family: var(--mono);
  font-size: var(--fs-sm);
}
.date-list span { display: block; padding: .12rem 0; color: var(--ink-2); break-inside: avoid; }
.date-list span.first { color: var(--accent-deep); }
.date-list span.first::after { content: ' 初'; font-family: var(--sans); font-size: var(--fs-xs); }
.date-list span.last::after { content: ' 最新'; font-family: var(--sans); font-size: var(--fs-xs); color: var(--ink); }

/* 录播片段 */
.clip-list { border-top: 1px solid var(--line); min-width: 0; }
.clip-item {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: .55rem .25rem;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  font-size: var(--fs-md);
  width: 100%;
  text-align: left;
  min-width: 0;
}
.clip-item > * { min-width: 0; }
.clip-item:hover { background: rgba(33, 28, 21, .04); }
.clip-item .num { color: var(--ink-3); font-size: var(--fs-sm); }
.clip-item .dur { margin-left: auto; font-family: var(--mono); font-size: var(--fs-sm); color: var(--ink-3); }
.clip-item .go { color: var(--ink-3); font-size: var(--fs-sm); }

/* 相关链接 */
.link-list { display: flex; flex-direction: column; gap: .4rem; }
.link-list a {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: .5rem .75rem;
  border: 1px solid var(--line-strong);
  border-radius: 5px;
  font-size: var(--fs-md);
  transition: all var(--dur);
}
.link-list a:hover { border-color: var(--ink); background: var(--surface); }
.link-list a .mono { color: var(--ink-3); font-size: var(--fs-xs); }
.detail-side { display: flex; flex-direction: column; gap: var(--space-5); }
.detail-side .tags-wrap { display: flex; flex-wrap: wrap; gap: .35rem; }

/* ─── 语言 / 原唱 / 常唱 ─── */
.lang-anchor {
  position: sticky;
  top: 3.6rem;
  z-index: 300;
  background: rgba(246, 242, 234, .95);
  backdrop-filter: blur(8px);
  padding: .6rem 0;
  border-bottom: 1px solid var(--line);
  display: flex;
  gap: .5rem;
  flex-wrap: wrap;
}
.catalog-block { margin-top: var(--space-6); }
.catalog-block h3 {
  font-size: var(--fs-xl);
  display: flex;
  align-items: baseline;
  gap: .7rem;
  padding-bottom: .5rem;
  border-bottom: 1px solid var(--ink);
  margin-bottom: .25rem;
}
.catalog-block h3 .mono { font-size: var(--fs-sm); color: var(--ink-3); font-weight: 400; }

.artist-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: .8rem;
}
.artist-cell {
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: .8rem .95rem;
  background: var(--surface);
  cursor: pointer;
  transition: border-color var(--dur), box-shadow var(--dur), transform var(--dur);
}
.artist-cell:hover { border-color: var(--ink); box-shadow: var(--shadow-flat); transform: translateY(-1px); }
.artist-cell h4 { font-size: var(--fs-base); display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; }
.artist-cell h4 .num { font-size: var(--fs-sm); color: var(--accent); }
.artist-cell p { font-size: var(--fs-sm); color: var(--ink-3); margin-top: .15rem; }
.artist-cell .songs {
  margin-top: .5rem;
  display: flex;
  flex-wrap: wrap;
  gap: .25rem;
  font-size: var(--fs-xs);
  color: var(--ink-2);
}
.artist-cell .songs span { background: rgba(33, 28, 21, .05); padding: 0 .4em; border-radius: 3px; }

/* ─── 洞察 ─── */
.insight-tabs { display: flex; gap: 1.4rem; border-bottom: 1px solid var(--ink); margin-bottom: var(--space-5); overflow-x: auto; }
.insight-tabs button {
  padding: .55rem 0;
  font-size: var(--fs-base);
  color: var(--ink-3);
  white-space: nowrap;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.insight-tabs button:hover { color: var(--ink); }
.insight-tabs button.active { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }

/* 热力图 */
.heat-controls { display: flex; gap: .4rem; margin-bottom: var(--space-4); flex-wrap: wrap; align-items: center; }
.heat-wrap { overflow-x: auto; padding-bottom: .5rem; }
.heat-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 14px); gap: 3px; width: max-content; }
.heat-cell {
  width: 14px; height: 14px;
  border-radius: 2px;
  background: rgba(33, 28, 21, .06);
  cursor: pointer;
}
.heat-cell:hover { outline: 1px solid var(--ink); }
.heat-months {
  display: grid;
  gap: 3px;
  width: max-content;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--ink-3);
  margin-top: .35rem;
  margin-left: 17px;
}
.heat-legend {
  display: flex;
  align-items: center;
  gap: .35rem;
  margin-top: .8rem;
  font-family: var(--mono);
  font-size: var(--fs-xs);
  color: var(--ink-3);
}
.heat-legend .sw { width: 12px; height: 12px; border-radius: 2px; }
.heat-scroll-hint { font-family: var(--mono); font-size: var(--fs-xs); color: var(--ink-3); margin-top: .3rem; display: none; }

/* 图表通用 */
.chart-note { font-family: var(--mono); font-size: var(--fs-xs); color: var(--ink-3); margin-bottom: var(--space-4); }
.hbar-list { display: flex; flex-direction: column; gap: .55rem; }
.hbar { display: grid; grid-template-columns: 9.5rem 1fr 5.5rem; gap: .8rem; align-items: center; font-size: var(--fs-md); }
.hbar .hlabel { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.hbar .htrack { height: 14px; background: rgba(33, 28, 21, .06); border-radius: 3px; overflow: hidden; }
.hbar .hfill { height: 100%; background: var(--accent); opacity: .85; }
.hbar .hfill.alt { background: var(--green); }
.hbar .hnum { font-family: var(--mono); font-size: var(--fs-sm); color: var(--ink-2); }

/* ─── 点歌 ─── */
.req-head-figs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-block: 1px solid var(--ink);
  margin: var(--space-4) 0 var(--space-6);
}
.req-head-figs .fig { padding: 1rem .75rem; border-right: 1px solid var(--line); }
.req-head-figs .fig:last-child { border-right: 0; }

.req-board-head { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; margin-bottom: var(--space-3); }
.req-board-head h3 { font-size: var(--fs-lg); }
.seg {
  display: inline-flex;
  border: 1px solid var(--line-strong);
  border-radius: 5px;
  overflow: hidden;
}
.seg button {
  padding: .3rem .8rem;
  font-size: var(--fs-sm);
  color: var(--ink-2);
  border-right: 1px solid var(--line-strong);
}
.seg button:last-child { border-right: 0; }
.seg button.active { background: var(--ink); color: var(--paper); }

.req-row {
  display: grid;
  grid-template-columns: 2.6rem minmax(0, 1fr) auto 5.5rem;
  gap: .8rem;
  align-items: center;
  padding: .5rem .35rem;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
}
.req-row:hover { background: rgba(33, 28, 21, .035); }
.req-row .rk { font-family: var(--mono); font-size: var(--fs-sm); color: var(--ink-3); text-align: right; }
.req-row:first-of-type .rk { color: var(--accent); font-weight: 600; }
.req-row .who {
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: .45rem;
  min-width: 0;
}
.req-row .who .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.req-row .cnt { font-family: var(--mono); font-weight: 600; }
.req-row .cnt small { color: var(--ink-3); font-weight: 400; font-family: var(--sans); font-size: var(--fs-xs); margin-left: .3em; }
.req-row .pctcol { font-family: var(--mono); font-size: var(--fs-sm); color: var(--ink-2); text-align: right; }

.req-expand {
  display: block;
  margin: .7rem auto 0;
  font-family: var(--mono);
  font-size: var(--fs-sm);
  color: var(--ink-2);
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  padding: .3rem 1.1rem;
}
.req-expand:hover { border-color: var(--ink); color: var(--ink); }

.req-cols { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6); }

.fire-list { display: flex; flex-direction: column; }
.fire-item { padding: .55rem .25rem; border-bottom: 1px solid var(--line); font-size: var(--fs-md); }
.fire-item b { font-weight: 600; }
.fire-item .fire { margin-right: .4em; }
.fire-item .chain-dates { font-family: var(--mono); font-size: var(--fs-xs); color: var(--ink-3); margin-left: .5em; }

.req-grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: var(--space-6); }

/* ─── 关于 ─── */
.about-cols { display: grid; grid-template-columns: 1.5fr 1fr; gap: var(--space-7); }
.about-block h3 { font-size: var(--fs-lg); margin: var(--space-5) 0 .7rem; }
.about-block h3:first-child { margin-top: 0; }
.about-block p, .about-block li { font-size: var(--fs-md); color: var(--ink-2); line-height: 1.9; }
.about-block ul { list-style: none; }
.about-block li { padding-left: 1.1em; position: relative; }
.about-block li::before { content: '—'; position: absolute; left: 0; color: var(--accent); }
.about-block a { border-bottom: 1px solid var(--line-strong); }
.about-block a:hover { border-bottom-color: var(--accent); color: var(--accent-deep); }
.chlog { border-top: 1px solid var(--ink); margin-top: .5rem; }
.chlog li { display: flex; gap: 1rem; padding: .5rem 0; border-bottom: 1px solid var(--line); font-size: var(--fs-md); }
.chlog .cl-date { font-family: var(--mono); font-size: var(--fs-sm); color: var(--accent-deep); white-space: nowrap; padding-top: .1rem; }
.chlog .cl-text { color: var(--ink-2); }

/* ═══════ 响应式 ═══════ */

/* 平板及以下 */
@media (max-width: 1024px) {
  .home-grid { grid-template-columns: 1fr; gap: var(--space-6); }
  .song-detail-grid { grid-template-columns: minmax(0, 1fr); }
  .detail-side { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-5); align-items: start; }
  .req-cols, .req-grid-2, .about-cols { grid-template-columns: minmax(0, 1fr); }
}

/* 手机横屏 / 窄平板 */
@media (max-width: 820px) {
  .rowrow { grid-template-columns: 2.4rem 1fr 4.5rem 5.6rem 2.4rem; }
  .row-artist { display: none; }
  .site-head-inner { padding: .55rem .9rem; gap: .8rem; }
  .head-actions .btn-ghost { display: none; }
  .figures { grid-template-columns: repeat(5, 1fr); }
  .req-head-figs { grid-template-columns: repeat(2, 1fr); }
  .req-head-figs .fig:nth-child(2n) { border-right: 0; }
  .req-head-figs .fig:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  .site-foot-inner { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .date-list { columns: 1; }
  .detail-side { grid-template-columns: minmax(0, 1fr); }
}

/* 手机 */
@media (max-width: 640px) {
  :root { --fs-2xl: 1.65rem; }
  .view { padding: var(--space-5) .9rem var(--space-7); }
  .masthead { padding: var(--space-5) 0 var(--space-4); }

  /* 顶栏折叠：品牌 + 横滚导航 + 收纳更多入口 */
  .head-actions { display: none; }
  .brand-text em { display: none; }
  .site-nav a { padding: .4rem .55rem; font-size: var(--fs-md); }

  /* 歌单行：两行堆叠 */
  .rowrow {
    grid-template-columns: 2rem 1fr 2.3rem;
    grid-template-areas:
      'idx name play'
      'idx sub  play';
    row-gap: .15rem;
    padding: .6rem .2rem;
  }
  .row-idx { grid-area: idx; align-self: start; padding-top: .2rem; }
  .row-name { grid-area: name; }
  .row-count {
    grid-area: sub;
    text-align: left;
    font-size: var(--fs-sm);
    font-weight: 400;
    color: var(--ink-3);
    display: flex;
    gap: .6rem;
    align-items: baseline;
  }
  .row-count::after { content: '次'; font-family: var(--sans); font-size: var(--fs-xs); }
  .row-last { grid-area: sub; justify-self: end; }
  .row-play { grid-area: play; align-self: center; }
  .rowrow::after { display: none; }

  .figures { grid-template-columns: repeat(2, 1fr); }
  .figures .fig { border-right: 0; border-bottom: 1px solid var(--line); }
  .figures .fig:nth-child(odd) { border-right: 1px solid var(--line); }
  .figures .fig:nth-child(n+4) { border-bottom: 0; }
  .fig-num { font-size: 1.5rem; }

  .toolbar .search { flex-basis: 100%; }
  .toolbar .select { flex: 1; }
  .export-wrap { position: static; }
  .export-pop { left: 0; right: 0; }

  .song-figures { grid-template-columns: repeat(3, 1fr); }
  .song-figures .fig-num { font-size: 1.15rem; }
  .song-figures .fig-label { font-size: var(--fs-xs); }

  .timeline-year { grid-template-columns: 2.4rem 1fr; gap: .5rem; }
  .hbar { grid-template-columns: 6.2rem 1fr 4.2rem; gap: .5rem; }
  .hbar .hlabel { font-size: var(--fs-sm); }

  .modal { max-height: 92vh; }
  .modal-root .overlay { padding: .6rem; align-items: end; }
  .modal { border-radius: 10px 10px 0 0; width: 100%; }

  .player {
    left: .6rem; right: .6rem; bottom: .6rem;
    width: auto;
  }
  .player.maximized { width: auto; }

  .req-row { grid-template-columns: 2rem minmax(0, 1fr) auto; }
  .req-row .pctcol { display: none; }

  .site-foot-inner { grid-template-columns: 1fr; gap: var(--space-5); }
  .foot-base-inner { flex-direction: column; gap: .3rem; }
  .back-top { right: .9rem; bottom: .9rem; }
  .heat-cell { width: 12px; height: 12px; }
  .heat-grid { grid-template-rows: repeat(7, 12px); }
  .heat-scroll-hint { display: block; }
}

/* 超窄 */
@media (max-width: 380px) {
  .figures .fig-num { font-size: 1.25rem; }
  .brand-text { font-size: .95rem; }
}

/* 打印 */
@media print {
  .site-head, .site-foot, .back-top, .player, .toolbar { display: none !important; }
  body { background: #fff; }
}

<script>
/* ═══════ 域层：对 SUI 数据的纯函数（无 DOM 依赖） ═══════
   筛选 / 排序 / 搜索 / 日期工具。业务口径与构建期（Python）一致。 */
(function () {
  'use strict';

  var D = {};

  D.today = new Date();

  D.songs = function () { return window.SUI.songs.songs; };
  D.dates = function () { return window.SUI.songs.dates; };
  D.stats = function () { return window.SUI.songs.stats; };
  D.requests = function () { return window.SUI.requests; };

  /* ---------- 查找 ---------- */
  D.findSong = function (name) {
    var songs = D.songs();
    name = String(name);
    for (var i = 0; i < songs.length; i++) if (songs[i].name === name) return songs[i];
    // 退化：大小写 / 波浪号归一化
    var norm = name.toLowerCase().replace(/\u301c|\uff5e/g, '~');
    for (i = 0; i < songs.length; i++) {
      if (songs[i].name.toLowerCase().replace(/\u301c|\uff5e/g, '~') === norm) return songs[i];
    }
    return null;
  };

  /* 演唱次数全局排名（次数 desc，歌名 asc —— 与旧系统一致） */
  var __rankMap = null;
  D.rankMap = function () {
    if (__rankMap) return __rankMap;
    var sorted = D.songs().slice().sort(function (a, b) {
      return b.count - a.count || a.name.localeCompare(b.name, 'zh');
    });
    __rankMap = {};
    sorted.forEach(function (s, i) { __rankMap[s.name] = i + 1; });
    return __rankMap;
  };
  D.resetRank = function () { __rankMap = null; };

  /* ---------- 筛选 / 排序 ---------- */
  D.daysSince = function (dateStr) {
    if (!dateStr) return 99999;
    var d = new Date(dateStr + 'T00:00:00');
    return Math.floor((D.today - d) / 86400000);
  };

  D.tierOf = function (count) { return count >= 5 ? 'frequent' : (count >= 2 ? 'occasional' : 'rare'); };
  D.tierName = function (count) { return count >= 5 ? '常唱' : (count >= 2 ? '偶尔' : '稀有'); };

  /* songs 视图状态 -> 过滤排序结果。state: {q,lang,tag,quick,sort} */
  D.querySongs = function (state) {
    var list = D.songs().slice();
    var q = (state.q || '').trim().toLowerCase();
    if (state.quick === 'frequent') list = list.filter(function (s) { return s.count >= 5; });
    else if (state.quick === 'occasional') list = list.filter(function (s) { return s.count >= 2 && s.count <= 4; });
    else if (state.quick === 'once') list = list.filter(function (s) { return s.count === 1; });
    else if (state.quick === 'dormant') {
      list = list
        .filter(function (s) { return D.daysSince(s.last) >= 180; })
        .sort(function (a, b) { return D.daysSince(b.last) - D.daysSince(a.last); });
    }
    if (state.lang && state.lang !== 'all') list = list.filter(function (s) { return s.lang === state.lang; });
    if (state.tag && state.tag !== 'all') {
      list = list.filter(function (s) { return s.tags && s.tags.indexOf(state.tag) !== -1; });
    }
    if (q) {
      list = list.filter(function (s) {
        return s.name.toLowerCase().indexOf(q) !== -1 ||
          (s.artist || '').toLowerCase().indexOf(q) !== -1 ||
          (s.t || '').toLowerCase().indexOf(q) !== -1;
      });
    }
    if (state.quick !== 'dormant') {
      var cmpName = function (a, b) { return a.name.localeCompare(b.name, 'zh'); };
      switch (state.sort) {
        case 'count-asc': list.sort(function (a, b) { return a.count - b.count || cmpName(a, b); }); break;
        case 'name-asc': list.sort(cmpName); break;
        case 'first-asc': list.sort(function (a, b) { return (a.first || 'z').localeCompare(b.first || 'z'); }); break;
        case 'last-desc': list.sort(function (a, b) { return (b.last || '').localeCompare(a.last || ''); }); break;
        case 'last-asc': list.sort(function (a, b) { return (a.last || 'z').localeCompare(b.last || 'z'); }); break;
        default: list.sort(function (a, b) { return b.count - a.count || cmpName(a, b); });
      }
    }
    return list;
  };

  /* 搜索命中高亮（纯文本 -> HTML） */
  D.highlight = function (text, query) {
    text = String(text == null ? '' : text);
    if (!query) return D.esc(text);
    var idx = text.toLowerCase().indexOf(query.toLowerCase());
    if (idx === -1) return D.esc(text);
    return D.esc(text.slice(0, idx)) + '<mark>' + D.esc(text.slice(idx, idx + query.length)) + '</mark>' + D.esc(text.slice(idx + query.length));
  };

  /* ---------- 格式 ---------- */
  D.esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  };

  D.fmtInt = function (n) { return (n || 0).toLocaleString('en-US'); };

  D.fmtPct = function (p) {
    if (p == null) return '';
    return (Number.isInteger(p) ? String(p) : p.toFixed(1)) + '%';
  };

  D.fmtDur = function (sec) {
    if (!sec) return '';
    return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  };

  D.fmtMonth = function (ym) { return ym ? ym.replace('-', '年') + '月' : ''; };

  D.clipDate = function (clip) { return clip.dt || '?'; };

  /* ---------- 点歌域 ---------- */
  D.levelOf = function (c) { return c >= 100 ? 5 : c >= 61 ? 4 : c >= 31 ? 3 : c >= 11 ? 2 : 1; };

  D.monthKey = function (d) {
    var t = d || D.today;
    return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0');
  };

  /* 当前月份字符串（本地时区） */
  D.thisMonth = function () { return D.monthKey(D.today); };

  window.SUIDomain = D;
})();

/* ═══════ 核心：hash 路由 + 视图注册 + DOM 工具 ═══════ */
(function () {
  'use strict';

  var C = {};
  var views = {};         // name -> {render(params, container)}
  var currentRoute = null;

  /* ---------- DOM 助手 ---------- */
  C.esc = function (s) { return window.SUIDomain.esc(s); };

  C.h = function (html) {
    var t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  };

  C.$ = function (sel, root) { return (root || document).querySelector(sel); };
  C.$$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

  C.debounce = function (fn, ms) {
    var t;
    return function () {
      var args = arguments, self = this;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(self, args); }, ms);

  /* ---------- 路由 ---------- */
  function parseHash() {
    var hash = location.hash || '#/';
    if (hash.charAt(0) === '#') hash = hash.slice(1);
    if (hash.charAt(0) !== '/') hash = '/' + hash;
    var qIdx = hash.indexOf('?');
    var path = qIdx === -1 ? hash : hash.slice(0, qIdx);
    var query = qIdx === -1 ? '' : hash.slice(qIdx + 1);
    var parts = path.split('/').filter(Boolean);   // ['songs'] or ['song', '名']
    var params = {};
    query.split('&').forEach(function (kv) {
      if (!kv) return;
      var eq = kv.indexOf('=');
      var k = eq === -1 ? kv : kv.slice(0, eq);
      var v = eq === -1 ? '' : kv.slice(eq + 1);
      try { params[decodeURIComponent(k)] = decodeURIComponent(v); } catch (e) { params[k] = v; }
    });
    return { parts: parts, params: params };
  }

  function routeName(parsed) {
    var p = parsed.parts;
    if (!p.length) return 'home';
    if (p[0] === 'song') return 'song';
    if (views[p[0]]) return p[0];
    return 'home';
  }

  /* 旧站锚点兼容：#lang-日语 -> #/languages?_anchor=日语 */
  function compatHash(hash) {
    var m = hash.match(/^#lang-(.+)$/);
    if (m) {
      var lang;
      try { lang = decodeURIComponent(m[1]); } catch (e) { lang = m[1]; }
      return '#/languages?_anchor=' + encodeURIComponent(lang);

    return null;

  C.buildHash = function (name, params, sub) {
    var path = name === 'home' ? '/' : '/' + name + (sub ? '/' + sub : '');
    var qs = [];
    Object.keys(params || {}).forEach(function (k) {
      var v = params[k];
      if (v === undefined || v === null || v === '' || v === 'all') return;
      if (k === 'page' && String(v) === '1') return;

    location.hash = C.buildHash(name, params, sub);

  /* 导航：replace（不写历史，用于搜索输入等高频状态；保持滚动位置） */
  var _skipScroll = false;
  C.replace = function (name, params, sub) {
    var url = C.buildHash(name, params, sub);
    history.replaceState(null, '', url);
    _skipScroll = true;
    renderCurrent();
  };

  function renderCurrent() {
    var parsed = parseHash();
    var name = routeName(parsed);
    var container = document.getElementById('view');
    var view = views[name];
    if (!view) return;

    var fn = view.render;
    document.querySelectorAll('#siteNav a').forEach(function (a) {
      a.classList.toggle('active', a.dataset.nav === name ||
        (name === 'song' && a.dataset.nav === 'songs'));
    });

    container.innerHTML = '';
    C.tip.hide();
    if (C.closeAllModals) C.closeAllModals();
    fn(parsed.params, container, parsed);
    currentRoute = { name: name, params: parsed.params };

    // 页面标题
    var t = '岁己SUI · 歌单档案';
    if (view.title) {
      var vt = typeof view.title === 'function' ? view.title(parsed.params, parsed) : view.title;
      if (vt) t = vt + ' · 岁己SUI 歌单档案';
    }
    document.title = t;

    var skip = _skipScroll;
    _skipScroll = false;
    if (!skip) window.scrollTo(0, 0);

    // 语言视图锚点（#/languages?_anchor=日语）
    if (parsed.params._anchor) {
      var anchor = document.getElementById('lang-' + parsed.params._anchor) ||
        document.getElementById(parsed.params._anchor);
      if (anchor) anchor.scrollIntoView({ block: 'start' });
    }
  }

  window.addEventListener('hashchange', function () {
    var compat = compatHash(location.hash);
    if (compat) { location.replace(compat); return; }
    renderCurrent();
  });

  C.registerView = function (name, view) { views[name] = view; };

  /* 语言视图锚点滚动（#/languages#lang-日语） */
  C.scrollToAnchor = function (id) {
    var el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  C.currentRoute = function () { return currentRoute; };

  /* ---------- Toast / Tooltip ---------- */
  C.toast = function (text) {
    var root = document.getElementById('toastRoot');
    var el = C.h('<div class="toast">' + C.esc(text) + '</div>');
    root.appendChild(el);
    setTimeout(function () { el.classList.add('out'); }, 1600);
    setTimeout(function () { el.remove(); }, 2000);
  };

  var tipEl = null, tipHide = null;
  C.tip = {
    show: function (html, x, y) {
      tipEl = tipEl || document.getElementById('globalTip');
      tipEl.innerHTML = html;
      tipEl.hidden = false;
      tipEl.style.left = '0px'; tipEl.style.top = '0px';
      var w = tipEl.offsetWidth, h = tipEl.offsetHeight;
      var left = Math.min(Math.max(8, x), window.innerWidth - w - 8);
      var top = y + 12;
      if (top + h > window.innerHeight - 8) top = y - h - 10;
      tipEl.style.left = left + 'px';
      tipEl.style.top = top + 'px';
    },
    hide: function () {
      if (tipHide) clearTimeout(tipHide);
      tipHide = setTimeout(function () { if (tipEl) tipEl.hidden = true; }, 120);
    },
    keep: function () { if (tipHide) clearTimeout(tipHide); }
  };
  document.addEventListener('mousemove', function (e) {
    if (tipEl && !tipEl.hidden) {
      var overTip = e.target.closest && e.target.closest('#globalTip');
      if (!overTip) return;
    }
  });

  /* 复制 */
  C.copy = function (text, okMsg) {
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        C.toast(ok ? (okMsg || '已复制') : '复制失败，请手动选择');
      } catch (err) { C.toast('复制失败'); }
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { C.toast(okMsg || '已复制'); }, fallback);
      } else fallback();
    } catch (err) { fallback(); }
  };

  /* 歌曲复制文案（与旧系统一致） */
  C.songCopyText = function (song) {
    var ds = window.SUIDomain.dates()[song.name] || [];
    var last = ds.length ? ds[ds.length - 1] : (song.last || '—');
    var total = ds.length ? '｜共演唱' + ds.length + '次' : '';
    return '🎵 ' + song.name + '｜最近演唱：' + last + total;
  };

  window.SUICore = C;
})();

/* ═══════ 组件：播放器 / 弹层框架 / 盲盒 / 我要补充 / 导出 / 页脚 ═══════ */
(function () {

  /* ═══════ 弹层框架 ═══════ */
  var modalStack = [];
  C.openModal = function (opts) {
    // opts: {kicker, title, body (Node|string), wide, onClose}
    var root = document.getElementById('modalRoot');
    var overlay = C.h(
      '<div class="overlay" role="dialog" aria-modal="true">' +
      '<div class="modal' + (opts.wide ? ' wide' : '') + '">' +
      '<div class="modal-head">' +
      (opts.kicker ? '<span class="modal-kicker">' + esc(opts.kicker) + '</span>' : '') +
      '<h3>' + esc(opts.title || '') + '</h3>' +
      '<button type="button" class="modal-x" aria-label="关闭">✕</button>' +
      '</div>' +
      '<div class="modal-body"></div>' +
      '</div></div>'
    );
    var body = overlay.querySelector('.modal-body');
    if (typeof opts.body === 'string') body.innerHTML = opts.body;
    else if (opts.body) body.appendChild(opts.body);

    function close() {
      overlay.remove();
      modalStack = modalStack.filter(function (m) { return m !== api; });
      document.body.style.overflow = modalStack.length ? 'hidden' : '';
      if (opts.onClose) opts.onClose();
    }
    overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
    overlay.querySelector('.modal-x').addEventListener('click', close);
    var api = { close: close, overlay: overlay, body: body };
    modalStack.push(api);
    root.appendChild(overlay);
    document.body.style.overflow = 'hidden';
    var focusable = body.querySelector('input, select, textarea, button');
    if (focusable) focusable.focus();
    return api;
  };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modalStack.length) modalStack[modalStack.length - 1].close();
  });
  C.closeAllModals = function () {

  };

      setMaximized(!player.maximized);
    });

    /* 拖拽（桌面 + 触屏） */
    var bar = document.getElementById('playerDrag');
    var dragging = false, dx = 0, dy = 0;
    function start(e) {
      if (e.target.closest('.player-btn, .player-select, .player-link, a, button')) return;
      dragging = true;
      var rect = els.panel.getBoundingClientRect();
      var cx = e.touches ? e.touches[0].clientX : e.clientX;
      var cy = e.touches ? e.touches[0].clientY : e.clientY;
      dx = cx - rect.left; dy = cy - rect.top;
      els.panel.style.right = 'auto';
      els.panel.style.bottom = 'auto';
      els.panel.style.left = rect.left + 'px';
      els.panel.style.top = rect.top + 'px';
      e.preventDefault();
    }
    function move(e) {
      if (!dragging) return;
      var cx = e.touches ? e.touches[0].clientX : e.clientX;
      var cy = e.touches ? e.touches[0].clientY : e.clientY;
      var vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
      var vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      var nx = Math.max(8, Math.min(cx - dx, vw - els.panel.offsetWidth - 8));
      var ny = Math.max(8, Math.min(cy - dy, vh - 60));
      els.panel.style.left = nx + 'px';
      els.panel.style.top = ny + 'px';
      e.preventDefault();
    }
    function end() { dragging = false; }
    bar.addEventListener('mousedown', start);
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', end);
    bar.addEventListener('touchstart', start, { passive: false });
    document.addEventListener('touchmove', move, { passive: false });
    document.addEventListener('touchend', end);
  }

  /* ═══════ 我要补充 ═══════ */
  function detectLang(text) {
    if (/[\u3040-\u309f\u30a0-\u30ff]/.test(text)) return '日语';
    if (/[\uac00-\ud7af]/.test(text)) return '韩语';
    if (/^[a-zA-Z0-9\s.,'!?&\-()]+$/.test(text.trim())) return '英文';
    if (/[\u4e00-\u9fff]/.test(text)) return '中文';
    return '其他';
  }

  async function lookupArtist(name) {
    try {
      var r = await fetch('https://musicbrainz.org/ws/2/recording/?query=' +
        encodeURIComponent(name) + '&limit=5&fmt=json', { headers: { Accept: 'application/json' } });
      if (r.ok) {
        var d = await r.json();
        if (d.recordings && d.recordings.length && d.recordings[0]['artist-credit']) {
          var n = d.recordings[0]['artist-credit'].map(function (a) { return a.name || (a.artist && a.artist.name) || ''; }).join('');
          if (n) return { artist: n, source: 'MusicBrainz' };
        }
      }
    } catch (e) { /* ignore */ }
    try {
      var r2 = await fetch('https://music.163.com/api/search/get/web?s=' +
        encodeURIComponent(name) + '&type=1&limit=3&offset=0', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded', Referer: 'https://music.163.com' }
      });
      if (r2.ok) {
        var d2 = await r2.json();
        if (d2.result && d2.result.songs && d2.result.songs.length) {
          var artists = (d2.result.songs[0].artists || []).map(function (a) { return a.name; }).join('/');
          if (artists) return { artist: artists, source: 'Netease Music' };
        }
      }
    } catch (e) { /* ignore */ }
    return null;
  }

  /* ═══════ 导出（当前筛选结果） ═══════ */
  C.bindExport = function (wrap, getFiltered) {
    var btn = wrap.querySelector('.export-btn');
    var pop = C.h(
      '<div class="export-pop" hidden>' +
      '<button type="button" data-fmt="csv">CSV<span class="mono">.csv</span></button>' +
      '<button type="button" data-fmt="json">JSON<span class="mono">.json</span></button>' +
      '<button type="button" data-fmt="xlsx">Excel<span class="mono">.xlsx</span></button>' +
      '</div>'
    );
    wrap.appendChild(pop);
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      pop.hidden = !pop.hidden;
    });
    document.addEventListener('click', function (e) {
      if (!pop.hidden && !pop.contains(e.target) && e.target !== btn) pop.hidden = true;
    });

    function exportRows() {
      return getFiltered().map(function (s, i) {
        return [i + 1, s.name, s.t || '', s.artist || '', s.lang || '', s.count,
          (s.tags || []).join('/'), s.first || '', s.last || ''];
      });
    }
    var header = ['序号', '歌曲名', '译名', '原唱', '语言', '演唱次数', '标签', '首次', '最近'];

    pop.addEventListener('click', function (e) {
      var fmt = e.target.closest('button') && e.target.closest('button').dataset.fmt;
      if (!fmt) return;
      pop.hidden = true;
      var songs = getFiltered();
      if (!songs.length) { C.toast('当前筛选结果为空'); return; }

      if (fmt === 'csv') {
        var csv = '\uFEFF' + header.join(',') + '\n' + exportRows().map(function (r) {
          return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(',');
        }).join('\n');
        download(new Blob([csv], { type: 'text/csv;charset=utf-8' }), 'sui_song_list.csv');
      } else if (fmt === 'json') {
        var json = JSON.stringify({
          total: songs.length,
          exported: new Date().toISOString(),
          songs: songs.map(function (s) {
            return { name: s.name, translated: s.t || '', artist: s.artist || '', lang: s.lang || '',
              count: s.count, tags: s.tags || [], first: s.first || '', last: s.last || '' };
          })
        }, null, 2);
        download(new Blob([json], { type: 'application/json;charset=utf-8' }), 'sui_song_list.json');
      } else if (fmt === 'xlsx') {
        loadSheetJS(function () {
          var rows = exportRows().map(function (r) {
            var o = {};
            header.forEach(function (h, i) { o[h] = r[i]; });
            return o;
          });
          var ws = XLSX.utils.json_to_sheet(rows);
          ws['!cols'] = [{ wch: 6 }, { wch: 30 }, { wch: 20 }, { wch: 20 }, { wch: 8 }, { wch: 10 }, { wch: 20 }, { wch: 12 }, { wch: 12 }];
          var wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, '歌单');
          XLSX.writeFile(wb, 'sui_song_list.xlsx');
        });
      }
      C.toast('已导出 ' + songs.length + ' 首');
    });
  };

  function download(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  var sheetjsLoading = false;
  function loadSheetJS(cb) {
    if (typeof XLSX !== 'undefined') { cb(); return; }
    if (sheetjsLoading) { setTimeout(function () { loadSheetJS(cb); }, 300); return; }
    sheetjsLoading = true;
    C.toast('正在加载 Excel 组件…');
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = function () { sheetjsLoading = false; cb(); };
    s.onerror = function () { sheetjsLoading = false; C.toast('Excel 组件加载失败，请检查网络'); };
    document.head.appendChild(s);
  }

    foot.querySelector('#footContribute').addEventListener('click', function (e) {

  /* ═══════ 全局绑定 ═══════ */
  function bindGlobal() {
